name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    name: Test and build Cleanroom.app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Lint Swift formatting
        run: swift format lint --recursive --parallel Sources Tests Package.swift

      - name: Run tests
        run: swift test

      - name: Assemble and sign app
        run: ./scripts/build-app.sh

      - name: Package verified app
        run: ./scripts/package-app.sh

      - name: Upload Cleanroom app
        uses: actions/upload-artifact@v4
        with:
          name: Cleanroom-macos-${{ github.sha }}
          path: |
            dist/Cleanroom.zip
            dist/Cleanroom.zip.sha256
          if-no-files-found: error
          retention-days: 14
