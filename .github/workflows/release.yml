name: macOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Cleanroom.app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.0

      - name: Validate release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "Expected v3.0.0 or v3.0.0-beta.1" >&2
            exit 1
          fi

      - name: Lint Swift formatting
        run: swift format lint --recursive --parallel Sources Tests Package.swift

      - name: Run tests
        run: swift test

      - name: Assemble versioned app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-beta.*}"
          CLEANROOM_VERSION="$VERSION" \
            CLEANROOM_BUILD_NUMBER="${GITHUB_RUN_NUMBER}" \
            ./scripts/build-app.sh

      - name: Package verified app
        run: |
          UPDATE_BASE_URL="https://github.com/rexbrahh/cleanroom/releases/download/$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            CLEANROOM_UPDATE_CHANNEL=beta \
              CLEANROOM_UPDATE_BASE_URL="$UPDATE_BASE_URL" \
              ./scripts/package-app.sh
          else
            CLEANROOM_UPDATE_CHANNEL=stable \
              CLEANROOM_UPDATE_BASE_URL="$UPDATE_BASE_URL" \
              ./scripts/package-app.sh
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANNEL=stable
          PRERELEASE_ARGS=()
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            CHANNEL=beta
            PRERELEASE_ARGS=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/Cleanroom.zip \
            dist/Cleanroom.zip.sha256 \
            "dist/$CHANNEL.json" \
            --verify-tag \
            --generate-notes \
            "${PRERELEASE_ARGS[@]}" \
            --title "Cleanroom $GITHUB_REF_NAME"
